      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 14px) 16px 12px;
    }

    .header-inner {
      max-width: 540px;
      margin: 0 auto;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .brand-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-pill.urgent {
      background: var(--red-soft);
      border-color: rgba(239, 68, 68, 0.35);
      color: var(--red-text);
    }

    .status-pill.warn {
      background: var(--amber-soft);
      border-color: rgba(245, 158, 11, 0.35);
      color: var(--amber-text);
    }

    .status-pill.ok {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.3);
      color: var(--green-text);
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tab-btn.active {
      background: var(--surface-elevated);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 16px calc(104px + var(--safe-bottom));
    }

    /* All Stores Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 34px 10px 12px;
      border-radius: var(--radius-sm);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--cyan);
    }

    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.15rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: flex;
    }

    .sort-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sort-btn:active {
      background: var(--surface-elevated);
    }

    /* Store List */
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .store-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 14px 15px 18px;
      overflow: hidden;
    }

    .store-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
    }

    .store-card.status-red::before { background: var(--red); }
    .store-card.status-amber::before { background: var(--amber); }
    .store-card.status-green::before { background: var(--green); }

    .store-card.status-red {
      border-color: rgba(239, 68, 68, 0.35);
    }

    .store-name {
      font-size: 1.04rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      word-break: break-word;
      flex: 1;
      min-width: 0;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .countdown-badge {
      font-size: 0.92rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 9px;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .status-red .countdown-badge {
      background: var(--red-soft);
      color: var(--red-text);
    }

    .status-amber .countdown-badge {
      background: var(--amber-soft);
      color: var(--amber-text);
    }

    .status-green .countdown-badge {
      background: var(--green-soft);
      color: var(--green-text);
    }

    .icon-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      appearance: none;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.danger:hover,
    .icon-btn.danger:active {
      color: var(--red-text);
      border-color: rgba(239, 68, 68, 0.45);
    }

    .more-link {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--cyan);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .more-link:active {
      background: var(--surface);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 46px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 14px;
      overflow: hidden;
    }

    .empty-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .empty-state p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Fixed Bottom Bar */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + var(--safe-bottom));
    }

    .bottom-inner {
      max-width: 540px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 10px;
    }

    .action-btn {
      appearance: none;
      border: none;
      border-radius: 13px;
      padding: 15px 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-add {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-cleaned {
      background: var(--primary-btn);
      color: #042f2e;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }

    .btn-cleaned:active {
      background: var(--primary-btn-hover);
    }

    /* Modals / Bottom Sheets */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.76);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(22px + var(--safe-bottom));
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.18s ease-out;
    }

    @media (min-width: 560px) {
      .modal-overlay {
        align-items: center;
        padding: 16px;
      }
      .modal-sheet {
        border-bottom: 1px solid var(--border);
        border-radius: 18px;
        padding-bottom: 20px;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .close-btn {
      appearance: none;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .text-input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 1.05rem;
      padding: 13px 14px;
      border-radius: 12px;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--cyan);
    }

    .helper-text {
      margin: 8px 0 0;
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .dup-warning {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: var(--amber-soft);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 11px;
      color: var(--amber-text);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .dup-warning.visible {
      display: block;
    }

    .dup-warning button {
      margin-top: 10px;
      width: 100%;
      padding: 11px;
      background: var(--amber);
      color: #1c1917;
      border: none;
      border-radius: 9px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-secondary {
      appearance: none;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      appearance: none;
      background: var(--primary-btn);
      border: none;
      color: #042f2e;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger {
      appearance: none;
      background: var(--red);
      border: none;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* A-Z Grid */
    .az-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    @media (min-width: 400px) {
      .az-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .az-btn {
      position: relative;
      appearance: none;
      height: 54px;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
    }

    .az-btn.has-stores {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.14);
      color: #e0f2fe;
    }

    .az-btn.has-stores:active {
      transform: scale(0.94);
      background: rgba(56, 189, 248, 0.28);
    }

    .az-btn:disabled {
      opacity: 0.24;
      cursor: default;
      background: var(--bg);
    }

    .az-count {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .letter-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back-btn {
      appearance: none;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .picker-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 55dvh;
      overflow-y: auto;
    }

    .picker-item {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .picker-item:active {
      background: var(--surface-elevated);
      border-color: var(--cyan);
    }

    .confirm-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 6px;
      font-size: 0.94rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .confirm-box strong {
      color: var(--text);
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(92px + var(--safe-bottom));
      transform: translateX(-50%) translateY(16px);
      z-index: 80;
      background: #0f172a;
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #ecfdf5;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="title-row">
        <div class="brand">
          <div class="brand-icon"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="icBg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131e38"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="icArc" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#icBg)"/>
  <circle cx="32" cy="32" r="21" stroke="#1e2b42" stroke-width="4.2"/>
  <path d="M32 11 A21 21 0 1 1 11 32" stroke="url(#icArc)" stroke-width="4.2" stroke-linecap="round"/>
  <g stroke="#e0f2fe" stroke-width="2.1" stroke-linecap="round">
    <line x1="32" y1="20" x2="32" y2="44"/>
    <line x1="21.6" y1="26" x2="42.4" y2="38"/>
    <line x1="42.4" y1="26" x2="21.6" y2="38"/>
  </g>
  <circle cx="32" cy="32" r="3.2" fill="#0ea5e9"/>
  <circle cx="32" cy="32" r="1.4" fill="#f0f9ff"/>
</svg></div>
          <div>
            <h1>Ice Clean</h1>
            <div class="brand-sub">60-day clean countdown</div>
          </div>
        </div>
        <div id="statusPill" class="status-pill">0 stores</div>
      </div>

      <div class="tabs" role="tablist">
        <button id="tabNext8" class="tab-btn active" role="tab" aria-selected="true">Next 8</button>
        <button id="tabAll" class="tab-btn" role="tab" aria-selected="false">All Stores (0)</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div id="allToolbar" class="toolbar hidden">
      <div class="search-wrap">
        <input id="searchInput" class="search-input" type="text" placeholder="Filter stores..." autocomplete="off">
        <button id="searchClear" class="search-clear" aria-label="Clear filter">&times;</button>
      </div>
      <button id="sortToggle" class="sort-btn">Sort: Soonest</button>
    </div>

    <div id="storeList" class="store-list"></div>
    <button id="viewAllLink" class="more-link hidden"></button>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <button id="openAddBtn" class="action-btn btn-add">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Store
      </button>
      <button id="openCleanedBtn" class="action-btn btn-cleaned">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Store Cleaned
      </button>
    </div>
  </div>

  <!-- Add Store Modal -->
  <div id="addModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
      <div class="modal-header">
        <h2 id="addModalTitle" class="modal-title">Add Store</h2>
        <button class="close-btn" data-close="addModal" aria-label="Close">&times;</button>
      </div>
      <form id="addForm">
        <label class="field-label" for="storeNameInput">Store Name</label>
        <input id="storeNameInput" class="text-input" type="text" placeholder="Enter store name" autocomplete="off" required maxlength="80">
        <p class="helper-text">Starts a fresh 60-day countdown from today.</p>

        <div id="dupWarning" class="dup-warning">
          <div id="dupMessage"></div>
          <button type="button" id="dupResetBtn">Reset Existing Store to 60 Days</button>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="addModal">Cancel</button>
          <button type="submit" class="btn-primary">Add Store</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Store Cleaned (A-Z) Modal -->
  <div id="cleanedModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="cleanedModalTitle">
      <div class="modal-header">
        <h2 id="cleanedModalTitle" class="modal-title">Store Cleaned</h2>
        <button class="close-btn" data-close="cleanedModal" aria-label="Close">&times;</button>
      </div>

      <div id="azStep">
        <p class="helper-text" style="margin-top:0; margin-bottom:10px;">Tap the first letter of the store you just cleaned:</p>
        <div id="azGrid" class="az-grid"></div>
      </div>

      <div id="letterStep" class="hidden">
        <div class="letter-header">
          <button type="button" id="azBackBtn" class="back-btn">&larr; A–Z</button>
          <div id="letterHeading" style="font-weight:700; font-size:1rem;"></div>
        </div>
        <div id="pickerList" class="picker-list"></div>
      </div>
    </div>
  </div>

  <!-- Confirm Reset Modal -->
  <div id="confirmResetModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="confirmResetTitle">
      <div class="modal-header">
        <h2 id="confirmResetTitle" class="modal-title">Confirm Reset</h2>
        <button class="close-btn" data-close="confirmResetModal" aria-label="Close">&times;</button>
      </div>
      <div id="confirmResetBody" class="confirm-box"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close="confirmResetModal">Cancel</button>
        <button type="button" id="confirmResetBtn" class="btn-primary">Reset to 60 Days</button>
      </div>
    </div>
  </div>

  <!-- Rename Store Modal -->
  <div id="renameModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="renameModalTitle">
      <div class="modal-header">
        <h2 id="renameModalTitle" class="modal-title">Rename Store</h2>
        <button class="close-btn" data-close="renameModal" aria-label="Close">&times;</button>
      </div>
      <form id="renameForm">
        <label class="field-label" for="renameInput">New Store Name</label>
        <input id="renameInput" class="text-input" type="text" autocomplete="off" required maxlength="80">
        <p id="renameError" class="helper-text hidden" style="color: var(--red-text);"></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="renameModal">Cancel</button>
          <button type="submit" class="btn-primary">Save Name</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Store Modal -->
  <div id="deleteModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="modal-header">
        <h2 id="deleteModalTitle" class="modal-title">Delete Store</h2>
        <button class="close-btn" data-close="deleteModal" aria-label="Close">&times;</button>
      </div>
      <div id="deleteBody" class="confirm-box"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close="deleteModal">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "ice_clean_countdown_stores_v1";
      const CYCLE_DAYS = 60;
      const WARN_THRESHOLD = 10;
      const TOP_LIMIT = 8;

      let stores = loadStores();
      let activeTab = "next8";
      let allSortMode = "soonest";
      let searchQuery = "";
      let lastRenderedDay = getTodayKey();

      let pendingResetId = null;
      let pendingRenameId = null;
      let pendingDeleteId = null;
      let dupStoreId = null;
      let toastTimer = null;

      const statusPill = document.getElementById("statusPill");
      const tabNext8 = document.getElementById("tabNext8");
      const tabAll = document.getElementById("tabAll");
      const allToolbar = document.getElementById("allToolbar");
      const searchInput = document.getElementById("searchInput");
      const searchClear = document.getElementById("searchClear");
      const sortToggle = document.getElementById("sortToggle");
      const storeList = document.getElementById("storeList");
      const viewAllLink = document.getElementById("viewAllLink");

      const addModal = document.getElementById("addModal");
      const addForm = document.getElementById("addForm");
      const storeNameInput = document.getElementById("storeNameInput");
      const dupWarning = document.getElementById("dupWarning");
      const dupMessage = document.getElementById("dupMessage");
      const dupResetBtn = document.getElementById("dupResetBtn");

      const cleanedModal = document.getElementById("cleanedModal");
      const azStep = document.getElementById("azStep");
      const azGrid = document.getElementById("azGrid");
      const letterStep = document.getElementById("letterStep");
      const azBackBtn = document.getElementById("azBackBtn");
      const letterHeading = document.getElementById("letterHeading");
      const pickerList = document.getElementById("pickerList");

      const confirmResetModal = document.getElementById("confirmResetModal");
      const confirmResetBody = document.getElementById("confirmResetBody");
      const confirmResetBtn = document.getElementById("confirmResetBtn");

      const renameModal = document.getElementById("renameModal");
      const renameForm = document.getElementById("renameForm");
      const renameInput = document.getElementById("renameInput");
      const renameError = document.getElementById("renameError");

      const deleteModal = document.getElementById("deleteModal");
      const deleteBody = document.getElementById("deleteBody");
      const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

      const toastEl = document.getElementById("toast");

      function getTodayKey() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function parseDateKeyUTC(key) {
        const parts = key.split("-").map(Number);
        return Date.UTC(parts[0], parts[1] - 1, parts[2]);
      }

      function getDaysRemaining(lastCleanedKey) {
        const todayUTC = parseDateKeyUTC(getTodayKey());
        const cleanedUTC = parseDateKeyUTC(lastCleanedKey);
        const elapsed = Math.round((todayUTC - cleanedUTC) / 86400000);
        return CYCLE_DAYS - elapsed;
      }

      function getDueDateLabel(fromKey) {
        const base = parseDateKeyUTC(fromKey) + CYCLE_DAYS * 86400000;
        const dt = new Date(base);
        return dt.toLocaleDateString(undefined, {
          day: "numeric",
          month: "short",
          year: "numeric",
          timeZone: "UTC"
        });
      }

      function getStatusClass(days) {
        if (days <= 0) return "status-red";
        if (days <= WARN_THRESHOLD) return "status-amber";
        return "status-green";
      }

      function formatCountdown(days) {
        if (days < 0) {
          const over = Math.abs(days);
          return over === 1 ? "1 day overdue" : `${over} days overdue`;
        }
        if (days === 0) return "Due today";
        if (days === 1) return "1 day";
        return `${days} days`;
      }

      function loadStores() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(s => s && typeof s.id === "string" && typeof s.name === "string" && typeof s.lastCleaned === "string");
        } catch (e) {
          return [];
        }
      }

      function saveStores() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stores));
        } catch (e) {
          showToast("Could not save to device storage");
        }
      }

      function makeId() {
        return "st_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
      }

      function getLetterGroup(name) {
        const first = name.trim().charAt(0).toUpperCase();
        return /^[A-Z]$/.test(first) ? first : "#";
      }

      function sortSoonest(list) {
        return list.slice().sort((a, b) => {
          const da = getDaysRemaining(a.lastCleaned);
          const db = getDaysRemaining(b.lastCleaned);
          if (da !== db) return da - db;
          return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
        });
      }

      function sortAZ(list) {
        return list.slice().sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
        );
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
      }

      function openModal(el) {
        el.classList.add("open");
        el.setAttribute("aria-hidden", "false");
      }

      function closeModal(el) {
        el.classList.remove("open");
        el.setAttribute("aria-hidden", "true");
      }

      document.querySelectorAll("[data-close]").forEach(btn => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(btn.getAttribute("data-close"));
          if (target) closeModal(target);
        });
      });

      document.querySelectorAll(".modal-overlay").forEach(overlay => {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) closeModal(overlay);
        });
      });

      function render() {
        lastRenderedDay = getTodayKey();
        const total = stores.length;
        tabAll.textContent = `All Stores (${total})`;

        const dueCount = stores.filter(s => getDaysRemaining(s.lastCleaned) <= 0).length;
        const soonCount = stores.filter(s => {
          const d = getDaysRemaining(s.lastCleaned);
          return d > 0 && d <= WARN_THRESHOLD;
        }).length;

        statusPill.className = "status-pill";
        if (total === 0) {
          statusPill.textContent = "0 stores";
        } else if (dueCount > 0) {
          statusPill.classList.add("urgent");
          statusPill.textContent = `${dueCount} due`;
        } else if (soonCount > 0) {
          statusPill.classList.add("warn");
          statusPill.textContent = `${soonCount} due soon`;
        } else {
          statusPill.classList.add("ok");
          statusPill.textContent = `${total} on track`;
        }

        tabNext8.classList.toggle("active", activeTab === "next8");
        tabNext8.setAttribute("aria-selected", String(activeTab === "next8"));
        tabAll.classList.toggle("active", activeTab === "all");
        tabAll.setAttribute("aria-selected", String(activeTab === "all"));

        allToolbar.classList.toggle("hidden", activeTab !== "all" || total === 0);
        sortToggle.textContent = allSortMode === "soonest" ? "Sort: Soonest" : "Sort: A–Z";
        searchClear.classList.toggle("visible", searchQuery.length > 0);

        storeList.innerHTML = "";
        viewAllLink.classList.add("hidden");

        if (total === 0) {
          const brandIconHtml = document.querySelector(".brand-icon").innerHTML;
          storeList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${brandIconHtml}</div>
              <h2>No stores added yet</h2>
              <p>Tap <strong>+ Add Store</strong> right after you clean a machine to start its 60-day countdown.</p>
            </div>
          `;
          return;
        }

        let items = [];
        if (activeTab === "next8") {
          items = sortSoonest(stores).slice(0, TOP_LIMIT);
          if (total > TOP_LIMIT) {
            viewAllLink.textContent = `Showing top ${TOP_LIMIT} of ${total} stores — View all →`;
            viewAllLink.classList.remove("hidden");
          }
        } else {
          const q = searchQuery.trim().toLowerCase();
          const filtered = q
            ? stores.filter(s => s.name.toLowerCase().includes(q))
            : stores;
          items = allSortMode === "soonest" ? sortSoonest(filtered) : sortAZ(filtered);

          if (items.length === 0) {
            storeList.innerHTML = `
              <div class="empty-state">
                <h2>No matching stores</h2>
                <p>No stores matched "<strong>${escapeHtml(searchQuery)}</strong>".</p>
              </div>
            `;
            return;
          }
        }

        const frag = document.createDocumentFragment();
        items.forEach(store => {
          const days = getDaysRemaining(store.lastCleaned);
          const status = getStatusClass(days);
          const card = document.createElement("div");
          card.className = `store-card ${status}`;

          if (activeTab === "next8") {
            card.innerHTML = `
              <div class="store-name">${escapeHtml(store.name)}</div>
              <div class="card-right">
                <div class="countdown-badge">${formatCountdown(days)}</div>
              </div>
            `;
          } else {
            card.innerHTML = `
              <div class="store-name">${escapeHtml(store.name)}</div>
              <div class="card-right">
                <div class="countdown-badge">${formatCountdown(days)}</div>
                <div class="icon-actions">
                  <button class="icon-btn" data-action="rename" data-id="${store.id}" aria-label="Rename ${escapeHtml(store.name)}" title="Rename">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                  </button>
                  <button class="icon-btn danger" data-action="delete" data-id="${store.id}" aria-label="Delete ${escapeHtml(store.name)}" title="Delete">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
                  </button>
                </div>
              </div>
            `;
          }
          frag.appendChild(card);
        });

        storeList.appendChild(frag);
      }

      tabNext8.addEventListener("click", () => {
        activeTab = "next8";
        render();
      });

      tabAll.addEventListener("click", () => {
        activeTab = "all";
        render();
      });

      viewAllLink.addEventListener("click", () => {
        activeTab = "all";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        render();
      });

      searchClear.addEventListener("click", () => {
        searchQuery = "";
        searchInput.value = "";
        render();
        searchInput.focus();
      });

      sortToggle.addEventListener("click", () => {
        allSortMode = allSortMode === "soonest" ? "az" : "soonest";
        render();
      });

      storeList.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");
        const store = stores.find(s => s.id === id);
        if (!store) return;

        if (action === "rename") {
          pendingRenameId = store.id;
          renameInput.value = store.name;
          renameError.classList.add("hidden");
          openModal(renameModal);
          setTimeout(() => {
            renameInput.focus();
            renameInput.select();
          }, 60);
        } else if (action === "delete") {
          pendingDeleteId = store.id;
          deleteBody.innerHTML = `Remove <strong>${escapeHtml(store.name)}</strong> from your list? This cannot be undone.`;
          openModal(deleteModal);
        }
      });

      function checkDuplicate(rawName) {
        const trimmed = rawName.trim().toLowerCase();
        if (!trimmed) {
          dupStoreId = null;
          dupWarning.classList.remove("visible");
          return null;
        }
        const existing = stores.find(s => s.name.trim().toLowerCase() === trimmed);
        if (existing) {
          dupStoreId = existing.id;
          const days = getDaysRemaining(existing.lastCleaned);
          dupMessage.innerHTML = `<strong>${escapeHtml(existing.name)}</strong> is already in your list (${formatCountdown(days)}).`;
          dupWarning.classList.add("visible");
          return existing;
        }
        dupStoreId = null;
        dupWarning.classList.remove("visible");
        return null;
      }

      document.getElementById("openAddBtn").addEventListener("click", () => {
        storeNameInput.value = "";
        dupStoreId = null;
        dupWarning.classList.remove("visible");
        openModal(addModal);
        setTimeout(() => storeNameInput.focus(), 60);
      });

      storeNameInput.addEventListener("input", () => {
        checkDuplicate(storeNameInput.value);
      });

      dupResetBtn.addEventListener("click", () => {
        if (!dupStoreId) return;
        const store = stores.find(s => s.id === dupStoreId);
        if (!store) return;
        store.lastCleaned = getTodayKey();
        saveStores();
        closeModal(addModal);
        render();
        showToast(`${store.name} reset to 60 days`);
      });

      addForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = storeNameInput.value.trim();
        if (!name) return;
        if (checkDuplicate(name)) return;
        stores.push({
          id: makeId(),
          name: name,
          lastCleaned: getTodayKey()
        });
        saveStores();
        closeModal(addModal);
        render();
        showToast(`${name} added — 60 days`);
      });

      function renderAZGrid() {
        azStep.classList.remove("hidden");
        letterStep.classList.add("hidden");
        azGrid.innerHTML = "";

        if (stores.length === 0) {
          azGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 20px 10px; color: var(--text-muted); font-size:0.92rem;">No stores in your list yet. Add a store first.</div>`;
          return;
        }

        const counts = {};
        stores.forEach(s => {
          const grp = getLetterGroup(s.name);
          counts[grp] = (counts[grp] || 0) + 1;
        });

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        if (counts["#"]) letters.push("#");

        const frag = document.createDocumentFragment();
        letters.forEach(letter => {
          const count = counts[letter] || 0;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "az-btn" + (count > 0 ? " has-stores" : "");
          btn.disabled = count === 0;
          btn.innerHTML = count > 0
            ? `${letter}<span class="az-count">${count}</span>`
            : letter;
          if (count > 0) {
            btn.addEventListener("click", () => showLetterStores(letter));
          }
          frag.appendChild(btn);
        });

        azGrid.appendChild(frag);
      }

      function showLetterStores(letter) {
        azStep.classList.add("hidden");
        letterStep.classList.remove("hidden");
        letterHeading.textContent = letter === "#" ? "Other stores (#)" : `Stores starting with "${letter}"`;

        const matches = sortAZ(stores.filter(s => getLetterGroup(s.name) === letter));
        pickerList.innerHTML = "";

        const frag = document.createDocumentFragment();
        matches.forEach(store => {
          const days = getDaysRemaining(store.lastCleaned);
          const status = getStatusClass(days);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `picker-item ${status}`;
          btn.innerHTML = `
            <span class="store-name">${escapeHtml(store.name)}</span>
            <span class="countdown-badge">${formatCountdown(days)}</span>
          `;
          btn.addEventListener("click", () => promptResetStore(store));
          frag.appendChild(btn);
        });
        pickerList.appendChild(frag);
      }

      function promptResetStore(store) {
        pendingResetId = store.id;
        const today = getTodayKey();
        const nextDue = getDueDateLabel(today);
        confirmResetBody.innerHTML = `Reset <strong>${escapeHtml(store.name)}</strong> to <strong>60 days</strong>?<br><span style="font-size:0.85rem;">Next clean due: ${nextDue}</span>`;
        closeModal(cleanedModal);
        openModal(confirmResetModal);
      }

      document.getElementById("openCleanedBtn").addEventListener("click", () => {
        renderAZGrid();
        openModal(cleanedModal);
      });

      azBackBtn.addEventListener("click", () => {
        azStep.classList.remove("hidden");
        letterStep.classList.add("hidden");
      });

      confirmResetBtn.addEventListener("click", () => {
        if (!pendingResetId) return;
        const store = stores.find(s => s.id === pendingResetId);
        if (!store) return;
        store.lastCleaned = getTodayKey();
        saveStores();
        pendingResetId = null;
        closeModal(confirmResetModal);
        render();
        showToast(`${store.name} reset to 60 days`);
      });

      renameForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!pendingRenameId) return;
        const newName = renameInput.value.trim();
        if (!newName) return;

        const duplicate = stores.find(
          s => s.id !== pendingRenameId && s.name.trim().toLowerCase() === newName.toLowerCase()
        );
        if (duplicate) {
          renameError.textContent = `"${duplicate.name}" already exists.`;
          renameError.classList.remove("hidden");
          return;
        }

        const store = stores.find(s => s.id === pendingRenameId);
        if (!store) return;
        store.name = newName;
        saveStores();
        pendingRenameId = null;
        closeModal(renameModal);
        render();
        showToast(`Renamed to ${newName}`);
      });

      confirmDeleteBtn.addEventListener("click", () => {
        if (!pendingDeleteId) return;
        const store = stores.find(s => s.id === pendingDeleteId);
        stores = stores.filter(s => s.id !== pendingDeleteId);
        saveStores();
        pendingDeleteId = null;
        closeModal(deleteModal);
        render();
        if (store) showToast(`${store.name} removed`);
      });

      function checkDayRollover() {
        if (getTodayKey() !== lastRenderedDay) {
          render();
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkDayRollover();
      });
      window.addEventListener("focus", checkDayRollover);
      setInterval(checkDayRollover, 60000);

      render();
    })();
  </script>
</body>
</html>
